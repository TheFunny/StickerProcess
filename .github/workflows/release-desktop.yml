name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch

      - name: Cache cargo
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            desktop-${{ runner.os }}-

      # 与 deploy-web.yml 同一防线：Release 资产可变，钉 sha256 再解压。
      - name: Install dx CLI
        shell: bash
        run: |
          curl -sSL -o dx.zip \
            https://github.com/dioxuslabs/dioxus/releases/download/v0.7.10/dx-x86_64-pc-windows-msvc.zip
          echo "45eb4f87b7f86fdba8508ee7e0ef1f9e13cf8f2ffcc6a2d5858d0e8ea7dd1531  dx.zip" | sha256sum -c -
          unzip -o dx.zip -d "$CARGO_HOME/bin"
          dx --version

      # 预构建静态 ffmpeg：由 ffmpeg-static-win 仓库的 CI 构建并发布（tag + sha256
      # 钉在 scripts/fetch-ffmpeg-static.sh，唯一出处）。
      - name: Fetch prebuilt ffmpeg static libs
        shell: bash
        run: |
          bash scripts/fetch-ffmpeg-static.sh
          echo "FFMPEG_DIR=$GITHUB_WORKSPACE/ffmpeg-dist" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked --release

      # 两个安装包变体：Dioxus.toml 的 webview_install_mode 无命令行覆盖，
      # 只能 sed 改 TOML 换装两次。产物必须 cp 到 dist/ —— 第二次 dx bundle
      # 会清空 nsis 目录（mv/留在原地都会丢，CI 实证）。
      # OfflineInstaller 内嵌 WebView2（大而稳），Skip 依赖系统已装 WebView2
      # （小，Win11 自带）。shell: bash —— runner 默认 pwsh 不认 sed/ls。
      - name: Bundle NSIS installer (offline webview)
        shell: bash
        run: |
          dx bundle --platform windows --package-types nsis --release
          mkdir -p dist
          f=$(ls target/dx/StickerProcess/bundle/windows/nsis/StickerProcess_*-setup.exe)
          b=$(basename "$f")
          cp "$f" "dist/${b%-setup.exe}-setup-webview.exe"

      - name: Bundle NSIS installer (skip webview)
        shell: bash
        run: |
          sed -i 's/webview_install_mode = { OfflineInstaller = { silent = true } }/webview_install_mode = { Skip = { } }/' Dioxus.toml
          dx bundle --platform windows --package-types nsis --release
          f=$(ls target/dx/StickerProcess/bundle/windows/nsis/StickerProcess_*-setup.exe)
          b=$(basename "$f")
          cp "$f" "dist/${b%-setup.exe}-setup-no-webview.exe"

      # 便携版：静态构建 exe 零 DLL 依赖（FFMPEG_DIR 树只链 .lib），解压即跑。
      # 显式 cargo build --release 保证 target/release/ 产物存在（不赌 dx bundle
      # 的内部输出路径；缓存热时该步近乎秒过）。
      - name: Build portable exe
        shell: bash
        run: |
          cargo build --locked --release
          v=${GITHUB_REF_NAME#v}
          cp target/release/StickerProcess.exe "dist/StickerProcess_${v}_x64-portable.exe"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*.exe
