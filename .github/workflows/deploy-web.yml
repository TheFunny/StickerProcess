name: Deploy web to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dioxus.toml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 单部署队列：新提交覆盖进行中的旧构建
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + dx
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: web-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dx CLI
        run: |
          if [ ! -x ~/.cargo/bin/dx ]; then
            curl -sSL -o dx.tgz \
              https://github.com/dioxuslabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz
            tar xzf dx.tgz -C ~/.cargo/bin
          fi
          dx --version

      # 32MB core 不入库（.gitignore）；从 wasm-core 孤儿分支取回。
      - name: Fetch ffmpeg core wasm
        run: |
          git fetch --depth 1 origin wasm-core
          git show origin/wasm-core:ffmpeg-core-st.wasm > assets/ffmpeg-core-st.wasm
          test -s assets/ffmpeg-core-st.wasm

      - name: Build web bundle (release)
        run: dx build --platform web --release --base-path /StickerProcess/

      # dx 不拷项目 assets/ 到产物目录（见 README/AGENTS.md）——手动补齐。
      - name: Assemble Pages artifact
        run: |
          out=web-dist
          mkdir -p "$out"
          cp -r target/dx/StickerProcess/release/web/public/. "$out/"
          cp assets/ffmpeg.js assets/814.ffmpeg.js assets/ffmpeg-core-st.js \
             assets/ffmpeg-core-st.wasm assets/ffmpeg-engine.js \
             assets/webcodecs-engine.js assets/webm-muxer.js assets/favicon.png "$out/"
          cp "$out/index.html" "$out/404.html"   # Pages 无 SPA fallback，404 兜底

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  # Pages 源 = workflow（build_type: workflow，Run 1 的 configure-pages 已切换）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
