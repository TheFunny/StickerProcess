[application]
name = "StickerProcess"

[bundle]
identifier = "com.stickerprocess.app"
publisher = "StickerProcess"
icon = ["ico/icon.ico"]
category = "GraphicsAndDesign"
short_description = "图片/短视频转 Telegram 贴纸工具"
# ffmpeg.exe 不再随包分发（shared exe 缺 DLL 无法在干净机器上运行）；
# sidecar 引擎按启动探测结果启用——用户自备 PATH 或主程序同目录的可执行
# 文件；inprocess（静态 libav）始终可用。构建矩阵规划见 docs/REFACTOR_PLAN.md P5。

[web]
# 子路径部署用 `dx build --web --release --base-path /StickerProcess/`（命令行参数）。
[web.app]
# dx 模板里的静态标题（爬虫读这份；App rsx 的 document::Title 管运行时）。
title = "Sticker Process"

[bundle.windows]
# WebView2 安装策略（文档 Bundle.windows）：
# OfflineInstaller = 内嵌离线安装器（当前默认行为，安装包大但离线可用）
webview_install_mode = { OfflineInstaller = { silent = true } }
