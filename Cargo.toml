[package]
name = "StickerProcess"
version = "0.1.0"
edition = "2024"

[dependencies]
#ffmpeg-next = "8"
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
log = "0.4.34"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
toml = "1"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "HtmlScriptElement", "Node", "FileReader", "DragEvent", "File", "FileList", "Blob", "BlobPropertyBag", "Url"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

# 桌面专属：ffmpeg 双引擎 / 文件对话框 / 资源管理器定位 / png 优化
ffmpeg-the-third = { version = "6", optional = true }
ffmpeg-sidecar = { version = "2.5", optional = true }
libc = { version = "0.2", optional = true }
oxipng = { version = "10.2", features = ["parallel", "zopfli"], default-features = false, optional = true }
rfd = { version = "0.17", optional = true }

# 桌面专属非可选：日志后端（wasm32 无 stderr，env_logger 的 regex 全家桶
# 白进产物）与 chrono（wasm 端时间戳走 js_sys::Date）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = "0.4.45"
pretty_env_logger = "0.5.0"

[features]
default = ["desktop"]
desktop = [
    "dep:ffmpeg-the-third",
    "dep:ffmpeg-sidecar",
    "dep:libc",
    "dep:oxipng",
    "dep:rfd",
    "dioxus/desktop",
    "dioxus/document",
    "dioxus/devtools",
    "dioxus/launch",
]
web = [
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dioxus/web",
    "dioxus/document",
    "dioxus/devtools",
    "dioxus/launch",
    "dioxus/html",
    "dioxus/signals",
    "dioxus/hooks",
]

[profile.release]
opt-level = "s"       # 优化代码尺寸，兼顾速度
lto = "fat"           # 启用最大程度的链接时优化
codegen-units = 1     # 降低代码生成单元数，增加优化时间但提升性能
panic = "abort"       # 使用 'abort' 而不是 'unwind' 来处理 panic
strip = "symbols"     # 移除符号信息，保留必要的调试信息
