[package]
name = "StickerProcess"
version = "0.1.0"
edition = "2024"

# 分工：[dependencies] 只放两平台共享项；序列化栈、引擎依赖、日志/时间后端
# 全部按 target 拆分——各平台只编译自己用得到的那一半。
[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["lib"] }
log = "0.4.34"
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.23"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# 设置持久化用 JSON（localStorage）——桌面用 toml
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "HtmlScriptElement", "Node", "FileReader", "DragEvent", "File", "FileList", "Blob", "BlobPropertyBag", "Url"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 设置持久化格式（wasm 端用 serde_json）
toml = "1"
# preview:// 协议的 percent 编解码（已在依赖树中，零新增编译单元）
percent-encoding = "2"
# 日志后端（wasm32 无 stderr，env_logger 的 regex 全家桶白进产物）
# 与 chrono（wasm 端时间戳走 js_sys::Date）
chrono = "0.4.45"
pretty_env_logger = "0.5.0"
# 引擎双轨 / 文件对话框 / 资源管理器定位 / png 优化（feature = "desktop" 消费）
ffmpeg-the-third = { version = "6", optional = true }
ffmpeg-sidecar = { version = "2.5", optional = true }
libc = { version = "0.2", optional = true }
oxipng = { version = "10.2", features = ["parallel", "zopfli"], default-features = false, optional = true }
rfd = { version = "0.17", optional = true }

[features]
default = ["desktop"]
desktop = [
    "dep:ffmpeg-the-third",
    "dep:ffmpeg-sidecar",
    "dep:libc",
    "dep:oxipng",
    "dep:rfd",
    "dioxus/desktop",
    "dioxus/document",
    "dioxus/devtools",
    "dioxus/launch",
]
web = [
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dioxus/web",
    "dioxus/document",
    "dioxus/devtools",
    "dioxus/launch",
    "dioxus/html",
    "dioxus/signals",
    "dioxus/hooks",
]

[profile.release]
opt-level = "s"       # 优化代码尺寸，兼顾速度
lto = "fat"           # 启用最大程度的链接时优化
codegen-units = 1     # 降低代码生成单元数，增加优化时间但提升性能
panic = "abort"       # 使用 'abort' 而不是 'unwind' 来处理 panic
strip = "symbols"     # 移除符号信息，保留必要的调试信息
